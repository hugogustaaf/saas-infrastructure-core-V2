<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="16" fill="#0d1117"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#f0f6fc">Observability &amp; Fault Containment Design</text>
  <text x="40" y="78" font-size="14" fill="#8b949e">How signals are captured and what responds to them</text>

  <!-- Column headings -->
  <g font-size="13" font-weight="600" fill="#58a6ff" letter-spacing="1">
    <text x="130" y="122" text-anchor="middle">SIGNAL</text>
    <text x="600" y="122" text-anchor="middle">CAPTURE</text>
    <text x="1070" y="122" text-anchor="middle">RESPONSE</text>
  </g>

  <!-- Row 1 -->
  <rect x="40" y="140" width="260" height="70" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="170" y="170" font-size="16" font-weight="600" fill="#f0f6fc" text-anchor="middle">Runtime errors</text>
  <text x="170" y="192" font-size="12" fill="#8b949e" text-anchor="middle">exceptions, failed API calls</text>
  <line x1="300" y1="175" x2="470" y2="175" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="470" y="140" width="260" height="70" rx="12" fill="#161b22" stroke="#2ea043" stroke-width="2"/>
  <text x="600" y="170" font-size="16" font-weight="600" fill="#f0f6fc" text-anchor="middle">Error reporter</text>
  <text x="600" y="192" font-size="12" fill="#8b949e" text-anchor="middle">sanitized before sending</text>
  <line x1="730" y1="175" x2="900" y2="175" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="900" y="140" width="260" height="70" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="1030" y="170" font-size="16" font-weight="600" fill="#f0f6fc" text-anchor="middle">Private alert channel</text>
  <text x="1030" y="192" font-size="12" fill="#8b949e" text-anchor="middle">owner is notified</text>

  <!-- Row 2 -->
  <rect x="40" y="235" width="260" height="70" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="170" y="265" font-size="16" font-weight="600" fill="#f0f6fc" text-anchor="middle">Privileged actions</text>
  <text x="170" y="287" font-size="12" fill="#8b949e" text-anchor="middle">admin and owner commands</text>
  <line x1="300" y1="270" x2="470" y2="270" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="470" y="235" width="260" height="70" rx="12" fill="#161b22" stroke="#2ea043" stroke-width="2"/>
  <text x="600" y="265" font-size="16" font-weight="600" fill="#f0f6fc" text-anchor="middle">Audit log table</text>
  <text x="600" y="287" font-size="12" fill="#8b949e" text-anchor="middle">persisted in PostgreSQL</text>
  <line x1="730" y1="270" x2="900" y2="270" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="900" y="235" width="260" height="70" rx="12" fill="#161b22" stroke="#2ea043" stroke-width="2"/>
  <text x="1030" y="265" font-size="16" font-weight="600" fill="#f0f6fc" text-anchor="middle">Retention cleanup</text>
  <text x="1030" y="287" font-size="12" fill="#8b949e" text-anchor="middle">scheduled database job</text>

  <!-- Row 3 -->
  <rect x="40" y="330" width="260" height="70" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="170" y="360" font-size="16" font-weight="600" fill="#f0f6fc" text-anchor="middle">Receipt checks</text>
  <text x="170" y="382" font-size="12" fill="#8b949e" text-anchor="middle">verification outcomes</text>
  <line x1="300" y1="365" x2="470" y2="365" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="470" y="330" width="260" height="70" rx="12" fill="#161b22" stroke="#2ea043" stroke-width="2"/>
  <text x="600" y="360" font-size="16" font-weight="600" fill="#f0f6fc" text-anchor="middle">Receipt log table</text>
  <text x="600" y="382" font-size="12" fill="#8b949e" text-anchor="middle">decision trail per receipt</text>
  <line x1="730" y1="365" x2="900" y2="365" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="900" y="330" width="260" height="70" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="1030" y="360" font-size="16" font-weight="600" fill="#f0f6fc" text-anchor="middle">Admin escalation</text>
  <text x="1030" y="382" font-size="12" fill="#8b949e" text-anchor="middle">suspicious cases with reasons</text>

  <!-- Row 4 -->
  <rect x="40" y="425" width="260" height="70" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="170" y="455" font-size="16" font-weight="600" fill="#f0f6fc" text-anchor="middle">Process health</text>
  <text x="170" y="477" font-size="12" fill="#8b949e" text-anchor="middle">per-tenant memory usage</text>
  <line x1="300" y1="460" x2="470" y2="460" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="470" y="425" width="260" height="70" rx="12" fill="#161b22" stroke="#2ea043" stroke-width="2"/>
  <text x="600" y="455" font-size="16" font-weight="600" fill="#f0f6fc" text-anchor="middle">PM2 memory guard</text>
  <text x="600" y="477" font-size="12" fill="#8b949e" text-anchor="middle">heap cap + restart threshold</text>
  <line x1="730" y1="460" x2="900" y2="460" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="900" y="425" width="260" height="70" rx="12" fill="#161b22" stroke="#2ea043" stroke-width="2"/>
  <text x="1030" y="455" font-size="16" font-weight="600" fill="#f0f6fc" text-anchor="middle">Automatic restart</text>
  <text x="1030" y="477" font-size="12" fill="#8b949e" text-anchor="middle">only the affected tenant</text>

  <!-- Configured limits strip -->
  <rect x="40" y="520" width="1120" height="64" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="60" y="545" font-size="12" font-weight="600" fill="#58a6ff" letter-spacing="1">CONFIGURED LIMITS</text>
  <g font-size="13" fill="#c9d1d9">
    <text x="60" y="568">Heap cap: 160 MB</text>
    <text x="250" y="568">Restart at: 220 MB</text>
    <text x="450" y="568">OCR: 1 worker</text>
    <text x="620" y="568">Receipt uploads: 4 per 10 min per user</text>
    <text x="940" y="568">Order TTL: 15 min</text>
  </g>

  <text x="40" y="606" font-size="12" fill="#6e7681">Design diagram and configured limits. Not live measurements.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
