<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="1200" height="640" rx="16" fill="#0d1117"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#f0f6fc">Telegram Commerce SaaS Engine</text>
  <text x="40" y="78" font-size="14" fill="#8b949e">System architecture · request, payment and verification paths</text>

  <!-- Customers -->
  <rect x="40" y="130" width="230" height="90" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="155" y="168" font-size="17" font-weight="600" fill="#f0f6fc" text-anchor="middle">Customers</text>
  <text x="155" y="192" font-size="13" fill="#8b949e" text-anchor="middle">Telegram clients</text>

  <!-- Payment gateways -->
  <rect x="40" y="430" width="230" height="90" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="155" y="468" font-size="17" font-weight="600" fill="#f0f6fc" text-anchor="middle">Payment Gateways</text>
  <text x="155" y="492" font-size="13" fill="#8b949e" text-anchor="middle">7 provider adapters</text>

  <!-- Webhook gateway -->
  <rect x="350" y="430" width="260" height="90" rx="12" fill="#161b22" stroke="#2f81f7" stroke-width="2"/>
  <text x="480" y="466" font-size="17" font-weight="600" fill="#f0f6fc" text-anchor="middle">Webhook Gateway</text>
  <text x="480" y="490" font-size="13" fill="#8b949e" text-anchor="middle">Express · Helmet · rate limit</text>
  <text x="480" y="508" font-size="12" fill="#58a6ff" text-anchor="middle">signature verification</text>

  <!-- Bot runtime -->
  <rect x="350" y="150" width="340" height="230" rx="14" fill="#161b22" stroke="#2ea043" stroke-width="2.5"/>
  <text x="520" y="186" font-size="19" font-weight="700" fill="#f0f6fc" text-anchor="middle">Bot Runtime</text>
  <text x="520" y="208" font-size="13" fill="#8b949e" text-anchor="middle">Node.js · Telegraf · one PM2 process per tenant</text>
  <rect x="375" y="228" width="290" height="36" rx="8" fill="#1f2a1f" stroke="#2ea043"/>
  <text x="520" y="251" font-size="13" fill="#7ee787" text-anchor="middle">Per-user mutex · rate limiting</text>
  <rect x="375" y="274" width="290" height="36" rx="8" fill="#1f2a1f" stroke="#2ea043"/>
  <text x="520" y="297" font-size="13" fill="#7ee787" text-anchor="middle">Order state machine · idempotent fulfillment</text>
  <rect x="375" y="320" width="290" height="36" rx="8" fill="#1f2a1f" stroke="#2ea043"/>
  <text x="520" y="343" font-size="13" fill="#7ee787" text-anchor="middle">Receipt forensics · fraud scoring</text>

  <!-- Right column -->
  <rect x="860" y="110" width="300" height="100" rx="12" fill="#161b22" stroke="#2ea043" stroke-width="2"/>
  <text x="1010" y="148" font-size="17" font-weight="600" fill="#f0f6fc" text-anchor="middle">PostgreSQL (Supabase)</text>
  <text x="1010" y="172" font-size="13" fill="#8b949e" text-anchor="middle">database per tenant</text>
  <text x="1010" y="192" font-size="12" fill="#7ee787" text-anchor="middle">atomic RPC · Row Level Security</text>

  <rect x="860" y="250" width="300" height="100" rx="12" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="1010" y="288" font-size="17" font-weight="600" fill="#f0f6fc" text-anchor="middle">OCR Service</text>
  <text x="1010" y="312" font-size="13" fill="#8b949e" text-anchor="middle">FastAPI · RapidOCR · OpenCV</text>
  <text x="1010" y="332" font-size="12" fill="#d2a8ff" text-anchor="middle">shared by all tenants</text>

  <rect x="860" y="390" width="300" height="90" rx="12" fill="#161b22" stroke="#2ea043" stroke-width="2"/>
  <text x="1010" y="428" font-size="17" font-weight="600" fill="#f0f6fc" text-anchor="middle">Admin Review</text>
  <text x="1010" y="452" font-size="13" fill="#8b949e" text-anchor="middle">escalation with evidence (Telegram)</text>

  <rect x="860" y="510" width="300" height="90" rx="12" fill="#161b22" stroke="#2ea043" stroke-width="2"/>
  <text x="1010" y="548" font-size="17" font-weight="600" fill="#f0f6fc" text-anchor="middle">Alert Channel</text>
  <text x="1010" y="572" font-size="13" fill="#8b949e" text-anchor="middle">runtime errors · private channel</text>

  <!-- Arrows: customers -> bot -->
  <line x1="270" y1="175" x2="350" y2="200" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="285" y="168" font-size="12" fill="#8b949e">Bot API</text>

  <!-- gateways -> webhook -->
  <line x1="270" y1="475" x2="350" y2="475" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="283" y="465" font-size="12" fill="#8b949e">callbacks</text>

  <!-- webhook -> bot -->
  <line x1="480" y1="430" x2="480" y2="382" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- bus from bot to right column -->
  <polyline points="690,265 775,265" fill="none" stroke="#8b949e" stroke-width="2"/>
  <line x1="775" y1="160" x2="775" y2="555" stroke="#8b949e" stroke-width="2"/>
  <line x1="775" y1="160" x2="860" y2="160" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="775" y1="300" x2="860" y2="300" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="775" y1="435" x2="860" y2="435" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="775" y1="555" x2="860" y2="555" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g font-size="13" fill="#8b949e">
    <rect x="40" y="580" width="14" height="14" rx="3" fill="none" stroke="#2ea043" stroke-width="2"/>
    <text x="62" y="592">per tenant</text>
    <rect x="160" y="580" width="14" height="14" rx="3" fill="none" stroke="#a371f7" stroke-width="2"/>
    <text x="182" y="592">shared service</text>
    <rect x="300" y="580" width="14" height="14" rx="3" fill="none" stroke="#d29922" stroke-width="2"/>
    <text x="322" y="592">external</text>
    <rect x="410" y="580" width="14" height="14" rx="3" fill="none" stroke="#2f81f7" stroke-width="2"/>
    <text x="432" y="592">ingress</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
